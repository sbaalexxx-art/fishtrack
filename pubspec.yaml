name: fishtrack
description: "FishTrack - Smart Fishing App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^6.3.2
  http: ^1.2.1

  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.3
  mapbox_maps_flutter: ^2.25.1
  shared_preferences: ^2.5.5
  geocoding: 5.0.0
  connectivity_plus: ^7.3.0
  timezone: ^0.11.1
  fl_chart: 1.2.0
  image: 4.8.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_performance: ^0.11.4+5
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/fluviai_logo.png
    - assets/branding/fluviai_wordmark.png
    - assets/images/auth/fluviai_login_hero.webp
    - assets/licenses/fonts/Geist-OFL.txt
    - assets/licenses/fonts/IBM-Plex-Mono-OFL.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/geist/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/geist/Geist-Black.ttf
          weight: 900
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/fluviai_logo.png
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: assets/branding/fluviai_logo.png
  adaptive_icon_foreground_inset: 13
  adaptive_icon_monochrome: assets/branding/fluviai_logo.png

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#0F1115"
  color_dark: "#0F1115"
  fullscreen: true
  android_12:
    color: "#0F1115"
    color_dark: "#0F1115"
