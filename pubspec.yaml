name: fishtrack
description: "FishTrack - Smart Fishing App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^6.3.2
  http: ^1.2.1

  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.3
  mapbox_maps_flutter: ^2.25.1
  shared_preferences: ^2.5.5
  geocoding: 5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/fluviai_logo.png
    - assets/branding/fluviai_wordmark.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/fluviai_logo.png
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: assets/branding/fluviai_logo.png
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: assets/branding/fluviai_logo.png

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#0F1115"
  color_dark: "#0F1115"
  image: assets/branding/fluviai_logo.png
  image_dark: assets/branding/fluviai_logo.png
  android_gravity: center
  fullscreen: true
  android_12:
    color: "#0F1115"
    color_dark: "#0F1115"
    image: assets/branding/fluviai_logo.png
    image_dark: assets/branding/fluviai_logo.png
    icon_background_color: "#0F1115"
    icon_background_color_dark: "#0F1115"
