name: B45C Hydro Map Guarded Apply

on:
  push:
    branches:
      - feature/b45c-hydro-map-canonical-pro
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/b45c-hydro-map-canonical-pro
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Normalize verified B45C Hydro patch guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_b45c_hydro_map_patch.py')
          text = path.read_text(encoding='utf-8')

          legacy_guard = "if null_count != 7:\n    raise SystemExit(f'ABORT stale-state guard: expected 7 Hydro clears, found {null_count}')"
          verified_guard = "if null_count != 8:\n    raise SystemExit(f'ABORT stale-state guard: expected 8 Hydro clears, found {null_count}')"
          if legacy_guard in text:
              text = text.replace(legacy_guard, verified_guard, 1)
          elif verified_guard not in text:
              raise SystemExit('ABORT guard normalization: neither verified nor legacy clear guard found')

          legacy_log = "          'genericHydropowerIgnored': pins.where((pin) => pin.isHydropower).length,\n"
          if legacy_log in text:
              text = text.replace(legacy_log, '', 1)

          path.write_text(text, encoding='utf-8')
          PY
          grep -F "if null_count != 8:" .github/scripts/apply_b45c_hydro_map_patch.py
          if grep -F "genericHydropowerIgnored" .github/scripts/apply_b45c_hydro_map_patch.py; then
            echo "::error::Legacy generic Hydro diagnostic path still exists in patch generator."
            exit 1
          fi

      - name: Apply guarded B45C Hydro patch
        run: python3 .github/scripts/apply_b45c_hydro_map_patch.py

      - name: Format touched Dart files
        run: >-
          dart format
          lib/screens/map_page.dart
          lib/widgets/fluviai/hydro_intelligence_panel.dart
          lib/services/hydro_map_canonical_service.dart
          lib/services/hydro_map_dispatch_presentation.dart
          test/hydro_map_canonical_service_test.dart
          test/hydro_map_dispatch_presentation_test.dart
          test/b45c_hydro_map_regression_test.dart

      - name: Analyze Hydro map integration
        run: >-
          flutter analyze
          lib/screens/map_page.dart
          lib/widgets/fluviai/hydro_intelligence_panel.dart
          lib/services/hydro_map_canonical_service.dart
          lib/services/hydro_map_dispatch_presentation.dart

      - name: Run canonical and B45C regression tests
        run: >-
          flutter test
          test/hydro_map_canonical_service_test.dart
          test/hydro_map_dispatch_presentation_test.dart
          test/b45c_hydro_map_regression_test.dart
          test/water_map_mobile_bridge_test.dart
          test/rc2_hydro_cartographic_language_test.dart
          test/rc2_hydro_identity_icon_semantics_test.dart
          test/rc2_hydro_product_clarity_test.dart

      - name: Verify protected station runtime remains present
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Future<void> _loadStations() async {" lib/screens/map_page.dart
          grep -F "_stationAnnotationManager" lib/screens/map_page.dart
          grep -F "_stationAnnotationOptions(" lib/screens/map_page.dart
          grep -F "'type': 'water_station'" lib/screens/map_page.dart

      - name: Verify no generic Hydro point path or MW preview
        shell: bash
        run: |
          set -euo pipefail
          if grep -F ".where((pin) => pin.isHydropower)" lib/screens/map_page.dart; then
            echo "::error::Legacy generic Hydro point rendering path remains."
            exit 1
          fi
          if grep -F "Putere instalată" lib/screens/map_page.dart || grep -F "Installed capacity" lib/screens/map_page.dart; then
            echo "::error::Installed MW must not be rendered in Hydro Map preview."
            exit 1
          fi
          grep -F "_hydroMapCanonicalService.getVerifiedSites" lib/screens/map_page.dart
          grep -F "hydro-panel-dispatch-summary" lib/widgets/fluviai/hydro_intelligence_panel.dart

      - name: Validate Mapbox public build token
        shell: bash
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MAPBOX_ACCESS_TOKEN:-}" || "${MAPBOX_ACCESS_TOKEN}" != pk.* ]]; then
            echo "::error::MAPBOX_ACCESS_TOKEN secret is missing or is not a public pk token."
            exit 1
          fi

      - name: Build Samsung ARM64 debug APK
        shell: bash
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
          test -f build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk \
            | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload Samsung QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Samsung QA APK
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated integration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/scripts/apply_b45c_hydro_map_patch.py \
            lib/screens/map_page.dart \
            lib/widgets/fluviai/hydro_intelligence_panel.dart
          if git diff --cached --quiet; then
            echo "::error::Guarded patch produced no integration changes."
            exit 1
          fi
          git commit -m "feat(hydro-map): wire canonical Hydro PRO over B45C"
          git push origin HEAD:feature/b45c-hydro-map-canonical-pro
