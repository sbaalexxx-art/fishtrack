name: B45C Hydro Canonical Gate

on:
  push:
    branches:
      - feature/b45c-hydro-map-canonical-pro
  pull_request:
    branches:
      - recovery/b45c-product-owner-pass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed Hydro head
        uses: actions/checkout@v6
        with:
          ref: feature/b45c-hydro-map-canonical-pro
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Apply robust one-shot Hydro camera repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          map_path = Path('lib/screens/map_page.dart')
          registry_path = Path('lib/core/map/map_feature_registry.dart')
          dock_path = Path('lib/features/hydro_dispatch/presentation/hydro_dispatch_functional_dock.dart')
          cartographic_test = Path('test/rc2_hydro_cartographic_language_test.dart')
          clarity_test = Path('test/rc2_hydro_product_clarity_test.dart')
          camera_test = Path('test/hydro_camera_sync_regression_test.dart')

          changed = False
          text = map_path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              global changed
              if new in source:
                  return source
              if source.count(old) != 1:
                  raise SystemExit(f'ABORT {label}: expected one old contract, found {source.count(old)}')
              changed = True
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              "                  onStyleLoaded: _onStyleLoaded,\n                  onMapIdle: _handleMapIdle,\n                  onMapTap: _handleHydroMapTap,",
              "                  onStyleLoaded: _onStyleLoaded,\n                  onCameraChange: _handleMapCameraChange,\n                  onMapIdle: _handleMapIdle,\n                  onMapTap: _handleHydroMapTap,",
              'parent camera callback',
          )
          text = replace_once(
              text,
              "    required this.onStyleLoaded,\n    required this.onMapIdle,\n    required this.onMapTap,",
              "    required this.onStyleLoaded,\n    required this.onCameraChange,\n    required this.onMapIdle,\n    required this.onMapTap,",
              'MapboxMapView constructor',
          )
          text = replace_once(
              text,
              "  final ValueChanged<mapbox.StyleLoadedEventData> onStyleLoaded;\n  final ValueChanged<mapbox.MapIdleEventData> onMapIdle;",
              "  final ValueChanged<mapbox.StyleLoadedEventData> onStyleLoaded;\n  final ValueChanged<mapbox.CameraChangedEventData> onCameraChange;\n  final ValueChanged<mapbox.MapIdleEventData> onMapIdle;",
              'MapboxMapView camera field',
          )
          text = replace_once(
              text,
              "      onStyleLoadedListener: widget.onStyleLoaded,\n      onMapIdleListener: widget.onMapIdle,",
              "      onStyleLoadedListener: widget.onStyleLoaded,\n      onCameraChangeListener: widget.onCameraChange,\n      onMapIdleListener: widget.onMapIdle,",
              'MapWidget camera listener',
          )

          visibility_start = text.index('  List<WaterMapPin> get _visibleHydropowerPins {')
          visibility_end = text.index('\n  Color _hydropowerOperationColor', visibility_start)
          visibility = text[visibility_start:visibility_end]
          if '_cameraZoom >= 11.4' in visibility:
              priority_start = visibility.index('          final priority =')
              priority_end_marker = '          return priority && densityKeys.contains(key);'
              priority_end = visibility.index(priority_end_marker, priority_start) + len(priority_end_marker)
              visibility = (
                  visibility[:priority_start]
                  + '          return densityKeys.contains(key);'
                  + visibility[priority_end:]
              )
              text = text[:visibility_start] + visibility + text[visibility_end:]
              changed = True
          if '_cameraZoom >= 11.4' in text[visibility_start:visibility_end]:
              raise SystemExit('ABORT: stale Hydro 11.4 gate remains')

          if '_handleMapCameraChange(mapbox.CameraChangedEventData data)' not in text:
              marker = '  Future<void> _handleMapIdle(mapbox.MapIdleEventData _) async {'
              handler = """  int _hydroCameraPresentationBucket(double zoom) {
            if (zoom < 5.6) return 0;
            if (zoom < 6.4) return 1;
            if (zoom < 7.4) return 2;
            if (zoom < 7.6) return 3;
            if (zoom < 8.2) return 4;
            if (zoom < 9.0) return 5;
            if (zoom < 9.2) return 6;
            if (zoom < 10.2) return 7;
            if (zoom < 10.8) return 8;
            return 9;
          }

          void _handleMapCameraChange(mapbox.CameraChangedEventData data) {
            if (!mounted) return;
            final zoom = data.cameraState.zoom;
            if (!zoom.isFinite) return;
            final previousBucket = _hydroCameraPresentationBucket(_cameraZoom);
            final nextBucket = _hydroCameraPresentationBucket(zoom);
            _cameraZoom = zoom;
            if (previousBucket == nextBucket) return;

            // Camera motion updates presentation only. Network/data refresh stays on
            // MapIdle, so pinch zoom remains responsive and never floods Supabase.
            unawaited(_syncStationAnnotations());
            unawaited(_syncWaterAssetAnnotations());
            unawaited(_syncHydropowerAnnotations());
          }

          """
              if text.count(marker) != 1:
                  raise SystemExit('ABORT: map idle marker mismatch')
              text = text.replace(marker, handler + marker, 1)
              changed = True

          if 'fluviai-hydropower-$operation-r$reportBadge-v3' not in text:
              if text.count('fluviai-hydropower-$operation-r$reportBadge-v2') != 1:
                  raise SystemExit('ABORT: Hydro icon cache contract mismatch')
              text = text.replace(
                  'fluviai-hydropower-$operation-r$reportBadge-v2',
                  'fluviai-hydropower-$operation-r$reportBadge-v3',
                  1,
              )
              changed = True

          if 'final haloColor = selected ? MapFeatureRegistry.hydropower : operationColor;' not in text:
              operation_marker = """      final operationColor = saved
                  ? MapFeatureRegistry.favorite
                  : _hydropowerOperationColor(pin.operationState);"""
              if text.count(operation_marker) != 1:
                  raise SystemExit('ABORT: Hydro operation color marker mismatch')
              text = text.replace(
                  operation_marker,
                  operation_marker + "\n      final haloColor = selected ? MapFeatureRegistry.hydropower : operationColor;",
                  1,
              )
              if text.count('operationColor.withValues(alpha: selected ? .22 : .12)') != 1:
                  raise SystemExit('ABORT: Hydro halo fill marker mismatch')
              text = text.replace(
                  'operationColor.withValues(alpha: selected ? .22 : .12)',
                  'haloColor.withValues(alpha: selected ? .28 : .12)',
                  1,
              )
              if text.count('selected ? Colors.white : operationColor.withValues(alpha: .78)') != 1:
                  raise SystemExit('ABORT: Hydro halo stroke marker mismatch')
              text = text.replace(
                  'selected ? Colors.white : operationColor.withValues(alpha: .78)',
                  'selected\n                  ? MapFeatureRegistry.hydropower\n                  : operationColor.withValues(alpha: .78)',
                  1,
              )
              changed = True

          map_path.write_text(text, encoding='utf-8')

          registry = registry_path.read_text(encoding='utf-8')
          old_color = 'static const Color hydropower = Color(0xFF7C6CFF);'
          new_color = 'static const Color hydropower = Color(0xFFE8C878);'
          if old_color in registry:
              registry = registry.replace(old_color, new_color, 1)
              registry_path.write_text(registry, encoding='utf-8')
              changed = True
          elif new_color not in registry:
              raise SystemExit('ABORT: Hydro semantic Gold contract missing')

          dock = dock_path.read_text(encoding='utf-8')
          if 'static const _cyan = Color(0xFF43D9CC);' in dock:
              dock = dock.replace(
                  'static const _cyan = Color(0xFF43D9CC);',
                  'static const _cyan = Color(0xFFE8C878);',
                  1,
              )
              changed = True
          anchor = dock.index('    final tomorrow = HydroDispatchPresentation.day(')
          if 'const SizedBox(width: 10)' in dock[anchor:]:
              row_start = dock.index('                Row(', anchor)
              row_end_marker = '                if (state.lastError != null) ...['
              row_end = dock.index(row_end_marker, row_start)
              replacement = """                Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    _DayCard(
                      data: today,
                      primary: true,
                      isRomanian: isRomanian,
                    ),
                    const SizedBox(height: 10),
                    _DayCard(
                      data: tomorrow,
                      primary: false,
                      isRomanian: isRomanian,
                    ),
                  ],
                ),
"""
              dock = dock[:row_start] + replacement + dock[row_end:]
              changed = True
          dock_path.write_text(dock, encoding='utf-8')

          for path in (cartographic_test, clarity_test):
              test = path.read_text(encoding='utf-8')
              test2 = test.replace(
                  "contains('_cameraZoom >= 11.4')",
                  "contains('return densityKeys.contains(key);')",
              ).replace(
                  'static const Color hydropower = Color(0xFF7C6CFF);',
                  'static const Color hydropower = Color(0xFFE8C878);',
              )
              if test2 != test:
                  path.write_text(test2, encoding='utf-8')
                  changed = True

          camera_source = """import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('Hydro pins synchronize while camera crosses zoom buckets', () {
    final mapPage = File('lib/screens/map_page.dart').readAsStringSync();
    final registry = File('lib/core/map/map_feature_registry.dart').readAsStringSync();
    final dock = File('lib/features/hydro_dispatch/presentation/hydro_dispatch_functional_dock.dart').readAsStringSync();

    expect(mapPage, contains('onCameraChange: _handleMapCameraChange'));
    expect(mapPage, contains('onCameraChangeListener: widget.onCameraChange'));
    expect(mapPage, contains('_handleMapCameraChange(mapbox.CameraChangedEventData data)'));
    expect(mapPage, contains('return densityKeys.contains(key);'));
    expect(mapPage, isNot(contains('_cameraZoom >= 11.4')));
    expect(mapPage, contains('Network/data refresh stays on'));
    expect(registry, contains('static const Color hydropower = Color(0xFFE8C878);'));
    expect(registry, isNot(contains('Color(0xFF7C6CFF)')));
    expect(mapPage, contains('fluviai-hydropower-$operation-r$reportBadge-v3'));
    expect(dock, contains('static const _cyan = Color(0xFFE8C878);'));
    expect(dock, contains('const SizedBox(height: 10)'));
  });
}
"""
          if not camera_test.exists() or camera_test.read_text(encoding='utf-8') != camera_source:
              camera_test.write_text(camera_source, encoding='utf-8')
              changed = True

          temp = Path('.github/workflows/hydro-camera-sync-patch.yml')
          if temp.exists():
              temp.unlink()
              changed = True

          print(f'changed={changed}')
          PY

          dart format \
            lib/screens/map_page.dart \
            lib/core/map/map_feature_registry.dart \
            lib/features/hydro_dispatch/presentation/hydro_dispatch_functional_dock.dart \
            test/rc2_hydro_cartographic_language_test.dart \
            test/rc2_hydro_product_clarity_test.dart \
            test/hydro_camera_sync_regression_test.dart
          git diff --check

          if git diff --quiet; then
            echo "Hydro camera repair already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Hydro zoom synchronization and Gold semantics"
          git push origin HEAD:feature/b45c-hydro-map-canonical-pro
