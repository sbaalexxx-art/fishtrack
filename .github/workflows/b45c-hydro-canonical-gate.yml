name: B45C Hydro Canonical Gate

on:
  push:
    branches:
      - feature/b45c-hydro-map-canonical-pro
  pull_request:
    branches:
      - recovery/b45c-product-owner-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/services/hydro_map_canonical_service.dart
          lib/services/hydro_map_dispatch_presentation.dart
          test/hydro_map_canonical_service_test.dart
          test/hydro_map_dispatch_presentation_test.dart

      - name: Analyze canonical Hydro services
        run: >-
          flutter analyze
          lib/services/hydro_map_canonical_service.dart
          lib/services/hydro_map_dispatch_presentation.dart

      - name: Run canonical Hydro contract tests
        run: >-
          flutter test
          test/hydro_map_canonical_service_test.dart
          test/hydro_map_dispatch_presentation_test.dart
