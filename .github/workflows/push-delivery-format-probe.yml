name: Push Delivery Format Probe

on:
  push:
    branches:
      - fix/push-delivery-samsung

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: |
          dart format lib/services/firebase_push_service.dart
          git diff -- lib/services/firebase_push_service.dart
          git diff --exit-code -- lib/services/firebase_push_service.dart
