name: Temporary Hydro Map CHE Redirect Patch

on:
  push:
    branches:
      - feature/hydro-dispatch-olt-p4d-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply Hydro map CHE redirect patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/hydro-dispatch-olt-p4d-recovery
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Patch canonical CHE tap redirect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/main_navigation.dart')
          text = path.read_text(encoding='utf-8')

          fields_old = '''  bool _fullMapInitialized = false;\n  bool _shellNavigationVisible = true;\n  bool _contentCanPop = false;\n'''
          fields_new = '''  bool _fullMapInitialized = false;\n  bool _shellNavigationVisible = true;\n  bool _contentCanPop = false;\n  bool _hydroMapRedirectRunning = false;\n  String? _lastHydroMapRedirectPlantId;\n  ProviderSubscription<SelectedContext?>? _hydroSelectionSubscription;\n'''
          if text.count(fields_old) != 1:
              raise SystemExit('ABORT: MainNavigation state field anchor changed')
          text = text.replace(fields_old, fields_new, 1)

          init_old = '''    AppNavigator.attachMainTabRouteSelector(_selectPage);\n    AppNavigator.attachShellNavigator(_contentNavigatorKey);\n    _shellNavigatorObserver = _ShellNavigatorObserver(\n'''
          init_new = '''    AppNavigator.attachMainTabRouteSelector(_selectPage);\n    AppNavigator.attachShellNavigator(_contentNavigatorKey);\n    _hydroSelectionSubscription = ref.listenManual<SelectedContext?>(\n      selectedContextProvider,\n      (previous, next) => _handleHydroMapCheSelection(next),\n    );\n    _shellNavigatorObserver = _ShellNavigatorObserver(\n'''
          if text.count(init_old) != 1:
              raise SystemExit('ABORT: MainNavigation init anchor changed')
          text = text.replace(init_old, init_new, 1)

          dispose_old = '''    AppNavigator.detachMainTabSelector();\n    AppNavigator.detachShellNavigator(_contentNavigatorKey);\n    _fullMapActive.dispose();\n'''
          dispose_new = '''    AppNavigator.detachMainTabSelector();\n    AppNavigator.detachShellNavigator(_contentNavigatorKey);\n    _hydroSelectionSubscription?.close();\n    _fullMapActive.dispose();\n'''
          if text.count(dispose_old) != 1:
              raise SystemExit('ABORT: MainNavigation dispose anchor changed')
          text = text.replace(dispose_old, dispose_new, 1)

          method_anchor = '''  void _handlePushOpened(RemoteMessage message) {\n'''
          method = '''  void _handleHydroMapCheSelection(SelectedContext? selected) {\n    if (!mounted ||\n        _selectedIndex != 1 ||\n        _contentCanPop ||\n        _hydroMapRedirectRunning ||\n        ref.read(fluviAccessTierProvider) != FluviAccessTier.premium) {\n      return;\n    }\n\n    final plantId = selected?.hydropowerPlantId?.trim();\n    if (plantId == null || plantId.isEmpty) return;\n    if (_lastHydroMapRedirectPlantId == plantId) return;\n\n    _lastHydroMapRedirectPlantId = plantId;\n    _hydroMapRedirectRunning = true;\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (!mounted || _selectedIndex != 1 || _contentCanPop) {\n        _hydroMapRedirectRunning = false;\n        _lastHydroMapRedirectPlantId = null;\n        return;\n      }\n\n      final label = selected?.locationName ?? selected?.primaryLabel;\n      unawaited(\n        AppNavigator.open<void>(\n          context,\n          AppDestination.hydropower,\n          arguments: label,\n          selectMainTab: _selectPage,\n        ).whenComplete(() {\n          if (!mounted) return;\n          _hydroMapRedirectRunning = false;\n          _lastHydroMapRedirectPlantId = null;\n        }),\n      );\n    });\n  }\n\n'''
          if text.count(method_anchor) != 1:
              raise SystemExit('ABORT: MainNavigation method anchor changed')
          text = text.replace(method_anchor, method + method_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/screens/main_navigation.dart
          flutter pub get
          flutter analyze lib/screens/main_navigation.dart

      - name: Commit redirect and remove temporary workflow
        shell: bash
        run: |
          git config user.name "FluviAI CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-hydro-map-che-redirect.yml
          git add lib/screens/main_navigation.dart
          git commit -m "fix(hydro): open dispatch on CHE map tap"
          git push origin HEAD:feature/hydro-dispatch-olt-p4d-recovery
