name: Media Storage Policy CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/repositories/catch_repository.dart'
      - 'lib/services/auth_service.dart'
      - 'lib/services/media_processing_service.dart'
      - 'lib/services/report_spam_service.dart'
      - 'pubspec.yaml'
      - 'supabase/migrations/**'
      - 'test/media_processing_policy_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: media-policy-pubspec-lock
          path: pubspec.lock
          retention-days: 1
      - name: Format gate
        run: |
          dart format \
            lib/services/media_processing_service.dart \
            lib/services/report_spam_service.dart \
            lib/services/auth_service.dart \
            lib/repositories/catch_repository.dart \
            test/media_processing_policy_test.dart
          git diff --exit-code -- \
            lib/services/media_processing_service.dart \
            lib/services/report_spam_service.dart \
            lib/services/auth_service.dart \
            lib/repositories/catch_repository.dart \
            test/media_processing_policy_test.dart
      - name: Analyze media patch
        run: >-
          flutter analyze
          lib/services/media_processing_service.dart
          lib/services/report_spam_service.dart
          lib/services/auth_service.dart
          lib/repositories/catch_repository.dart
          test/media_processing_policy_test.dart
      - name: Media policy regression tests
        run: >-
          flutter test
          test/media_processing_policy_test.dart
          test/report_spam_service_test.dart
      - name: Record full-project baseline analyze
        continue-on-error: true
        run: flutter analyze
