name: P4D Flutter Gate

on:
  push:
    branches:
      - feature/hydro-dispatch-olt-p4d-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydro-mobile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Hydro Dispatch integration
        run: flutter analyze lib/features/hydro_dispatch

      - name: Analyze destination bridge
        run: flutter analyze lib/features/figma_complete/presentation/figma_destination_router.dart

      - name: Analyze notification deep-link bridge
        run: flutter analyze lib/screens/main_navigation.dart

      - name: Run Hydro Dispatch contract tests
        run: flutter test test/hydro_dispatch_mobile_contract_test.dart
